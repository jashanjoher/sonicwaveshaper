name: Build SonicWaveshaper

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install cmake ninja

      - name: Fetch JUCE 8.0.6
        run: git clone --depth 1 --branch 8.0.6 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp -R build/SonicWaveshaper_artefacts/Release/VST3/*.vst3 artifacts/ || true
          cp -R build/SonicWaveshaper_artefacts/Release/AU/*.component artifacts/ || true
          cp -R build/SonicWaveshaper_artefacts/Release/Standalone/*.app artifacts/ || true
          cd artifacts && zip -r ../SonicWaveshaper-macOS.zip . && cd ..
          ls -la artifacts

      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SonicWaveshaper-macOS
          path: SonicWaveshaper-macOS.zip
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch JUCE 8.0.6
        shell: bash
        run: git clone --depth 1 --branch 8.0.6 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure CMake (MSVC)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          cp -R build/SonicWaveshaper_artefacts/Release/VST3/*.vst3 artifacts/ || true
          cp -R build/SonicWaveshaper_artefacts/Release/Standalone/*.exe artifacts/ || true
          cd artifacts && 7z a ../SonicWaveshaper-Windows.zip . && cd ..
          ls -la artifacts

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SonicWaveshaper-Windows
          path: SonicWaveshaper-Windows.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: SonicWaveshaper-macOS
          path: release

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: SonicWaveshaper-Windows
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/SonicWaveshaper-macOS.zip
            release/SonicWaveshaper-Windows.zip
          generate_release_notes: true
