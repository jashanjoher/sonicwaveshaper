name: Build SonicWaveshaper

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install cmake ninja

      - name: Fetch JUCE 8.0.6
        run: git clone --depth 1 --branch 8.0.6 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp -R build/SonicWaveshaper_artefacts/Release/VST3/*.vst3 artifacts/ || true
          cp -R build/SonicWaveshaper_artefacts/Release/AU/*.component artifacts/ || true
          cp -R build/SonicWaveshaper_artefacts/Release/Standalone/*.app artifacts/ || true
          cd artifacts && zip -r ../SonicWaveshaper-macOS.zip . && cd ..
          ls -la artifacts

      - name: Build DMG installer
        run: |
          set -euo pipefail
          STAGE="dmg-stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE"

          # Copy the plugin bundles into the staging folder.
          cp -R build/SonicWaveshaper_artefacts/Release/VST3/SonicWaveshaper.vst3 "$STAGE/"
          cp -R build/SonicWaveshaper_artefacts/Release/AU/SonicWaveshaper.component "$STAGE/"
          cp -R build/SonicWaveshaper_artefacts/Release/Standalone/SonicWaveshaper.app "$STAGE/"

          # Symlinks to the system plugin folders, so the user drags each bundle onto its folder in Finder.
          ln -s /Library/Audio/Plug-Ins/VST3 "$STAGE/VST3 Plug-Ins (drop SonicWaveshaper.vst3 here)"
          ln -s /Library/Audio/Plug-Ins/Components "$STAGE/AU Components (drop SonicWaveshaper.component here)"
          ln -s /Applications "$STAGE/Applications"

          cat > "$STAGE/README - Install.txt" <<'EOF'
SonicWaveshaper - install on macOS

1. Drag SonicWaveshaper.vst3 onto the "VST3 Plug-Ins" folder link.
2. Drag SonicWaveshaper.component onto the "AU Components" folder link.
3. Drag SonicWaveshaper.app onto Applications (optional, standalone app).
4. Enter your administrator password if macOS asks. These folders are system-wide.
5. Restart your DAW so it scans for the new plugin.

The build is not notarized. If macOS blocks the standalone app on first launch, right-click it and choose Open, or run:
  xattr -dr com.apple.quarantine /Applications/SonicWaveshaper.app

Windows: coming soon.
EOF

          hdiutil create -volname "SonicWaveshaper" -srcfolder "$STAGE" -ov -format UDZO SonicWaveshaper-macOS.dmg
          hdiutil verify SonicWaveshaper-macOS.dmg
          ls -la SonicWaveshaper-macOS.dmg

      - name: Upload macOS zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonicWaveshaper-macOS-zip
          path: SonicWaveshaper-macOS.zip
          if-no-files-found: error

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonicWaveshaper-macOS-dmg
          path: SonicWaveshaper-macOS.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch JUCE 8.0.6
        shell: bash
        run: git clone --depth 1 --branch 8.0.6 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure CMake (MSVC)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          cp -R build/SonicWaveshaper_artefacts/Release/VST3/*.vst3 artifacts/ || true
          cp -R build/SonicWaveshaper_artefacts/Release/Standalone/*.exe artifacts/ || true
          cd artifacts && 7z a ../SonicWaveshaper-Windows.zip . && cd ..
          ls -la artifacts

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SonicWaveshaper-Windows
          path: SonicWaveshaper-Windows.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS zip artifact
        uses: actions/download-artifact@v4
        with:
          name: SonicWaveshaper-macOS-zip
          path: release

      - name: Download macOS DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: SonicWaveshaper-macOS-dmg
          path: release

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: SonicWaveshaper-Windows
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/SonicWaveshaper-macOS.dmg
            release/SonicWaveshaper-macOS.zip
            release/SonicWaveshaper-Windows.zip
          generate_release_notes: true
