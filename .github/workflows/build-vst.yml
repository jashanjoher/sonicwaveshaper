name: Build SonicWaveshaper

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Get JUCE 8.0.6
        run: git clone --depth 1 --branch 8.0.6 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release

      - name: Make the DMG installer
        run: bash packaging/make-dmg.sh

      - name: Upload the DMG
        uses: actions/upload-artifact@v4
        with:
          name: SonicWaveshaper-macOS-dmg
          path: SonicWaveshaper-macOS.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Get JUCE 8.0.6
        shell: bash
        run: git clone --depth 1 --branch 8.0.6 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SonicWaveshaper-Windows
          path: build/SonicWaveshaper_artefacts/Release/VST3
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the DMG
        uses: actions/download-artifact@v4
        with:
          name: SonicWaveshaper-macOS-dmg
          path: release

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: release/SonicWaveshaper-macOS.dmg
          generate_release_notes: true
