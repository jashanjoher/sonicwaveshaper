name: Build SonicWaveshaper

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Get JUCE 8.0.6
        run: git clone --depth 1 --branch 8.0.6 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --verbose

      - name: Make the DMG installer
        run: bash packaging/make-dmg.sh

      - name: Upload the DMG
        uses: actions/upload-artifact@v4
        with:
          name: SonicWaveshaper-macOS-dmg
          path: SonicWaveshaper-macOS.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Toolchain preflight
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          cl 2>&1 | Select-Object -First 1
          where.exe cl
          where.exe link
          git --version

      - name: Get JUCE 8.0.6
        shell: bash
        run: git clone --depth 1 --branch 8.0.6 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure
        shell: pwsh
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release --log-level=VERBOSE

      - name: Build
        run: cmake --build build --config Release --verbose

      - name: Package the Windows zip
        shell: pwsh
        run: |
          $out = "build/SonicWaveshaper_artefacts/Release"
          $stage = "windows-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse -Force "$out/VST3/SonicWaveshaper.vst3" $stage
          Copy-Item -Force "$out/Standalone/SonicWaveshaper.exe" $stage
          Copy-Item -Force "packaging/README-install-windows.txt" "$stage/READ ME FIRST.txt"
          Compress-Archive -Path "$stage/*" -DestinationPath "SonicWaveshaper-Windows.zip" -Force
          Get-ChildItem "SonicWaveshaper-Windows.zip"

      - name: Upload the Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: SonicWaveshaper-Windows-zip
          path: SonicWaveshaper-Windows.zip
          if-no-files-found: error

      - name: Upload CMake logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cmake-logs
          path: |
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
            build/CMakeCache.txt
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the DMG
        uses: actions/download-artifact@v4
        with:
          name: SonicWaveshaper-macOS-dmg
          path: release

      - name: Download the Windows zip
        uses: actions/download-artifact@v4
        with:
          name: SonicWaveshaper-Windows-zip
          path: release

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/SonicWaveshaper-macOS.dmg
            release/SonicWaveshaper-Windows.zip
          generate_release_notes: true
