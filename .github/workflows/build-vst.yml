name: Build SonicWaveshaper

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install cmake ninja

      - name: Fetch JUCE 8.0.6
        run: git clone --depth 1 --branch 8.0.6 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Locate build outputs
        run: |
          echo "Searching for plugin bundles under build/:"
          find build -maxdepth 6 \( -name "SonicWaveshaper.vst3" -o -name "SonicWaveshaper.component" -o -name "SonicWaveshaper.app" \) -print || true

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp -R build/SonicWaveshaper_artefacts/Release/VST3/*.vst3 artifacts/ || true
          cp -R build/SonicWaveshaper_artefacts/Release/AU/*.component artifacts/ || true
          cp -R build/SonicWaveshaper_artefacts/Release/Standalone/*.app artifacts/ || true
          cd artifacts && zip -r ../SonicWaveshaper-macOS.zip . && cd ..
          ls -la artifacts

      - name: Build DMG installer
        run: |
          set -euo pipefail
          STAGE="dmg-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          VST3_SRC="build/SonicWaveshaper_artefacts/Release/VST3/SonicWaveshaper.vst3"
          AU_SRC="build/SonicWaveshaper_artefacts/Release/AU/SonicWaveshaper.component"
          APP_SRC="build/SonicWaveshaper_artefacts/Release/Standalone/SonicWaveshaper.app"

          for p in "$VST3_SRC" "$AU_SRC" "$APP_SRC"; do
            if [ ! -e "$p" ]; then
              echo "ERROR: missing build output: $p"
              echo "Found these SonicWaveshaper bundles:"
              find build -maxdepth 6 -name "SonicWaveshaper*" -print || true
              exit 1
            fi
          done

          cp -R "$VST3_SRC" "$STAGE/"
          cp -R "$AU_SRC" "$STAGE/"
          cp -R "$APP_SRC" "$STAGE/"

          ln -s /Library/Audio/Plug-Ins/VST3 "$STAGE/VST3 folder - drag SonicWaveshaper.vst3 here"
          ln -s /Library/Audio/Plug-Ins/Components "$STAGE/AU folder - drag SonicWaveshaper.component here"
          ln -s /Applications "$STAGE/Applications"

          {
            echo "SonicWaveshaper - install on macOS"
            echo ""
            echo "1. Drag SonicWaveshaper.vst3 onto the 'VST3 folder' link."
            echo "2. Drag SonicWaveshaper.component onto the 'AU folder' link."
            echo "3. Drag SonicWaveshaper.app onto Applications (optional standalone app)."
            echo "4. Enter your administrator password if macOS asks. These folders are system-wide."
            echo "5. Restart your DAW so it scans for the new plugin."
            echo ""
            echo "The build is not notarized. If macOS blocks the standalone app on first launch,"
            echo "right-click it and choose Open, or run:"
            echo "  xattr -dr com.apple.quarantine /Applications/SonicWaveshaper.app"
            echo ""
            echo "Windows: coming soon."
          } > "$STAGE/README - Install.txt"

          hdiutil create -volname "SonicWaveshaper" -srcfolder "$STAGE" -ov -format UDZO SonicWaveshaper-macOS.dmg
          hdiutil verify SonicWaveshaper-macOS.dmg
          ls -la SonicWaveshaper-macOS.dmg

      - name: Upload macOS zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonicWaveshaper-macOS-zip
          path: SonicWaveshaper-macOS.zip
          if-no-files-found: error

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: SonicWaveshaper-macOS-dmg
          path: SonicWaveshaper-macOS.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch JUCE 8.0.6
        shell: bash
        run: git clone --depth 1 --branch 8.0.6 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure CMake (MSVC)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          cp -R build/SonicWaveshaper_artefacts/Release/VST3/*.vst3 artifacts/ || true
          cp -R build/SonicWaveshaper_artefacts/Release/Standalone/*.exe artifacts/ || true
          cd artifacts && 7z a ../SonicWaveshaper-Windows.zip . && cd ..
          ls -la artifacts

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SonicWaveshaper-Windows
          path: SonicWaveshaper-Windows.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS zip artifact
        uses: actions/download-artifact@v4
        with:
          name: SonicWaveshaper-macOS-zip
          path: release

      - name: Download macOS DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: SonicWaveshaper-macOS-dmg
          path: release

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: SonicWaveshaper-Windows
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/SonicWaveshaper-macOS.dmg
            release/SonicWaveshaper-macOS.zip
            release/SonicWaveshaper-Windows.zip
          generate_release_notes: true
